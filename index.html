<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>График</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--fg:#16202b;--muted:#64717f;--line:#d5dbe2;--accent:#0b6e63;--on:#fff;--err:#b4281f}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--surface:#18212a;--fg:#e8edf2;--muted:#8e9baa;--line:#2a3541;--accent:#6fd9c8;--on:#0c2622;--err:#ff8f84;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
label{font-size:14px;color:var(--muted)}
input,button{font:inherit;border-radius:9px;padding:11px 12px;width:100%}
input{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:22px;letter-spacing:.3em;text-align:center}
button{border:0;background:var(--accent);color:var(--on);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{font-size:14px;color:var(--err);min-height:1.4em;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>График</h1>
  <label for="p">Пин-код, 6 цифр</label>
  <input id="p" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus required>
  <button id="b" type="submit">Открыть</button>
  <p id="msg" role="alert"></p>
</form>
